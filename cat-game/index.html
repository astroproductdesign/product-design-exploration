<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e8c6" />
    <meta name="description" content="A cosy real-time cat companion. Your cat lives on its own schedule — check in, play, feed and pet whenever you like." />
    <title>Cat Companion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-56 -56 112 96'%3E%3Cpath d='M 0 30 C -30 30 -50 22 -50 0 C -50 -10 -49 -16 -48 -22 L -46 -43 Q -45 -50 -39 -46 L -22 -34 Q 0 -38 22 -34 L 39 -46 Q 45 -50 46 -43 L 48 -22 C 49 -16 50 -10 50 0 C 50 22 30 30 0 30 Z' fill='%23fcfcfc'/%3E%3Cpath d='M -50 6 C -36 2 -24 -2 -14 -6 C -8 -10 -4 -12 0 -12 C 4 -12 8 -10 14 -6 C 24 -2 36 2 50 6 L 50 -50 L -50 -50 Z' fill='%23a8957c'/%3E%3Cpath d='M 0 30 C -30 30 -50 22 -50 0 C -50 -10 -49 -16 -48 -22 L -46 -43 Q -45 -50 -39 -46 L -22 -34 Q 0 -38 22 -34 L 39 -46 Q 45 -50 46 -43 L 48 -22 C 49 -16 50 -10 50 0 C 50 22 30 30 0 30 Z' fill='none' stroke='%231b1714' stroke-width='7' stroke-linejoin='round'/%3E%3Ccircle cx='-22' cy='2' r='6.5' fill='%231b1714'/%3E%3Ccircle cx='22' cy='2' r='6.5' fill='%231b1714'/%3E%3Cellipse cx='0' cy='8' rx='6' ry='4.5' fill='%231b1714'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="namecard" id="nameBtn" aria-label="Profile and settings">
          <span class="mood-face" id="moodFace"></span>
          <span class="name-text"><b id="catName">…</b><small id="moodText"></small></span>
        </button>
        <div class="meters" aria-label="How your cat is doing">
          <div class="meter" title="Tummy"><span class="ico" id="mFullIco"></span><i><b id="mFull"></b></i></div>
          <div class="meter" title="Energy"><span class="ico" id="mEnergyIco"></span><i><b id="mEnergy"></b></i></div>
          <div class="meter" title="Happiness"><span class="ico" id="mHappyIco"></span><i><b id="mHappy"></b></i></div>
        </div>
        <div class="right">
          <div class="clock"><b id="clockTime"></b><small id="clockPhase"></small></div>
          <button class="iconbtn" id="muteBtn" aria-label="Sound"></button>
        </div>
      </header>

      <div class="bondbar" title="Bond only ever goes up">
        <span class="ico" id="bondIco"></span><span>Bond <b>Lv <span id="bondLv">1</span></b></span>
        <span class="bond-track"><i id="bondFill"></i></span><small id="bondNext"></small>
      </div>

      <main class="stage" id="stage">
        <svg id="scene" role="img" aria-label="Your cat's room"></svg>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="flash" id="flash"></div>
      </main>

      <p class="status" id="status"></p>

      <nav class="toolbar" id="toolbar" aria-label="Actions"></nav>
      <nav class="toolbar playbar" id="playbar" hidden>
        <span id="playHint">Drag the toy around!</span>
        <button class="btn primary" id="doneBtn">Done playing</button>
      </nav>
    </div>

    <div class="modal-back" id="modal" hidden>
      <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
    </div>

    <!-- Game logic (no drawing) -->
    <script src="js/core/random.js"></script>
    <script src="js/core/clock.js"></script>
    <script src="js/core/profile.js"></script>
    <script src="js/core/coats.js"></script>
    <script src="js/core/photoread.js"></script>
    <script src="js/core/catalog.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/progression.js"></script>
    <script src="js/core/sim.js"></script>
    <script src="js/core/interactions.js"></script>
    <script src="js/core/journal.js"></script>
    <!-- Screen -->
    <script src="js/ui/catArt.js"></script>
    <script src="js/ui/roomArt.js"></script>
    <script src="js/ui/sound.js"></script>
    <script src="js/ui/scene.js"></script>
    <script src="js/ui/app.js"></script>
  </body>
</html>
